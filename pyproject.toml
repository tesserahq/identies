[project]
name = "identies"
version = "0.1.0"
description = ""
authors = [
    {name = "Emiliano Jankowski",email = "ejankowski@gmail.com"}
]
packages = [
    { include = "app" }
]
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry.scripts]
dev = "run:dev"

[tool.poetry]
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.162.0"
python-dotenv = "^1.0.0"
gunicorn = "26.2.0"
faker = "40.44.0"
sqlalchemy = "~2.1.6"
sqlalchemy-json = "^0.7.0"
asyncpg = "^0.32.0"
psycopg2-binary = "^2.9.10"
alembic = "^1.15.1"
vaulta-client = { git = "https://github.com/estate-buddy-tech/vaulta-py.git", branch = "main" }

fastapi-pagination = "^0.16.0"
pydantic = {extras = ["email"], version = "^2.11.3"}
black = "^26.10.1"
ruff = "0.17.3"
pydantic-settings = "^2.16.2"
python-jose = "^3.3.0"

opentelemetry-instrumentation-fastapi = "^0.66b1"
opentelemetry-exporter-otlp-proto-grpc = "^1.39.1"
opentelemetry-sdk = "^1.39.1"
opentelemetry-instrumentation-sqlalchemy = "^0.66b1"
opentelemetry-instrumentation-logging = "^0.66b1"
opentelemetry-instrumentation-requests = "^0.66b1"
prometheus-client = ">=0.23.1"

pyjwt = "^2.10.1"
rollbar = "^1.3.0"
cryptography = "^50.0.0"
PyYAML = "^6.0.1"
uvicorn = "0.54.0"
# tessera-sdk = { path = "../tessera-sdk-py/", develop = true }
tessera-sdk = {git = "https://github.com/tesserahq/tessera-sdk-py.git", rev = "8dc9085ae00fb85e76a7ce36e78be55e1279e27f"}
opentelemetry-instrumentation-faststream = "^0.1.3"
prometheus-fastapi-instrumentator = "^8.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
httpx = "^0.28.0"  # Required by FastAPI TestClient
pytest-asyncio = "^1.4.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
